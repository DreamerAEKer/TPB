<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔑 TPB Key Generator — Admin Only</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Sarabun', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; padding: 24px 16px; }
  .wrap { width: 100%; max-width: 560px; }
  h1 { font-size: 1.3rem; color: #38bdf8; margin-bottom: 2px; }
  .subtitle { font-size: 0.78rem; color: #475569; margin-bottom: 16px; }
  .warn { background: #450a0a; border: 1px solid #7f1d1d; border-radius: 8px; padding: 9px 13px; font-size: 0.78rem; color: #fca5a5; margin-bottom: 18px; }

  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 22px; margin-bottom: 16px; }
  .card-title { font-size: 0.78rem; color: #38bdf8; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }

  label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; margin-top: 12px; }
  label:first-of-type { margin-top: 0; }
  input, select { width: 100%; padding: 9px 11px; background: #0f172a; border: 1px solid #334155; border-radius: 7px; color: #e2e8f0; font-size: 0.9rem; font-family: inherit; transition: border-color 0.2s; }
  input:focus, select:focus { outline: none; border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2,132,199,0.15); }
  select option { background: #1e293b; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

  .pf-badge { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

  .gen-btn { width: 100%; padding: 12px; margin-top: 18px; background: linear-gradient(135deg,#0284c7,#0369a1); border: none; border-radius: 9px; color: white; font-size: 1rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s; font-family: inherit; }
  .gen-btn:hover { opacity: 0.88; }

  /* Key Output */
  .key-output-wrap { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 18px; margin-bottom: 16px; display: none; }
  .key-label { font-size: 0.75rem; color: #64748b; margin-bottom: 8px; }
  .key-line { display: flex; align-items: center; gap: 8px; background: #0f172a; border: 1.5px solid #0284c7; border-radius: 8px; padding: 10px 14px; }
  .key-text { font-family: 'Courier New', monospace; font-size: 1.1rem; font-weight: 700; color: #38bdf8; letter-spacing: 1.5px; flex: 1; word-break: break-all; }
  .key-actions { display: flex; gap: 8px; margin-top: 12px; }
  .key-actions button { flex: 1; padding: 9px; border-radius: 7px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: 1px solid #334155; font-family: inherit; transition: all 0.2s; }
  .btn-copy { background: #0f172a; color: #38bdf8; border-color: #0284c7; }
  .btn-copy:hover { background: #0284c7; color: white; }
  .btn-save { background: #0f172a; color: #4ade80; border-color: #16a34a; }
  .btn-save:hover { background: #16a34a; color: white; }
  .key-meta { margin-top: 10px; font-size: 0.76rem; color: #64748b; line-height: 1.7; background: #0f172a; border-radius: 7px; padding: 9px 12px; }
  .key-meta span { color: #94a3b8; }

  /* History */
  .hist-card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 18px; }
  .hist-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .hist-title { font-size: 0.78rem; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  .btn-csv { padding: 5px 12px; border-radius: 6px; background: #0f172a; color: #94a3b8; border: 1px solid #334155; font-size: 0.75rem; cursor: pointer; font-family: inherit; }
  .btn-csv:hover { border-color: #38bdf8; color: #38bdf8; }
  .hist-list { max-height: 320px; overflow-y: auto; }
  .hist-item { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 0.78rem; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hist-key { font-family: monospace; color: #38bdf8; font-size: 0.82rem; }
  .hist-info { color: #64748b; line-height: 1.5; flex: 1; min-width: 0; }
  .hist-info strong { color: #94a3b8; }
  .hist-copy { padding: 3px 8px; border-radius: 5px; background: transparent; border: 1px solid #334155; color: #64748b; font-size: 0.72rem; cursor: pointer; white-space: nowrap; }
  .hist-copy:hover { border-color: #0284c7; color: #38bdf8; }
  .empty-hist { text-align: center; color: #334155; padding: 20px; font-size: 0.82rem; }

  .pf-red { background: #ef4444; }
  .pf-blue { background: #3b82f6; }
  .pf-plat { background: linear-gradient(135deg,#a8a29e,#d4d4d4); }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔑 TPB License Key Generator</h1>
  <div class="subtitle">Thai Post Bill v7.1.1 — Admin Tool &nbsp;|&nbsp; ห้ามแจกจ่ายไฟล์นี้</div>
  <div class="warn">⚠️ ไฟล์นี้สำหรับผู้ดูแลระบบเท่านั้น — อย่าแชร์ให้ลูกค้า</div>

  <!-- Input Card -->
  <div class="card">
    <div class="card-title">📋 ข้อมูลลูกค้า</div>

    <label>Post Family No. (เลข THP 8 หลัก)</label>
    <input type="text" id="inp-thp" maxlength="8" placeholder="เช่น 12345678"
      oninput="this.value=this.value.replace(/\D/g,'').substring(0,8)">

    <div class="row2">
      <div>
        <label>ชื่อผู้ใช้ / บริษัท <span style="color:#ef4444;">*</span></label>
        <input type="text" id="inp-name" placeholder="จำเป็นต้องกรอก" style="border-color:#334155;">
      </div>
      <div>
        <label>เบอร์โทร (ไม่บังคับ)</label>
        <input type="text" id="inp-phone" placeholder="เช่น 0812345678" maxlength="20"
          oninput="this.value=this.value.replace(/[^\d\-+() ]/g,'')">
      </div>
    </div>

    <div class="row2">
      <div>
        <label>วันที่เริ่มสัญญา</label>
        <input type="date" id="inp-start">
      </div>
      <div>
        <label>ระดับ Post Family</label>
        <select id="inp-pf-level">
          <option value="Red">🔴 Red Box (100–1,999 คะแนน)</option>
          <option value="Blue">🔵 Blue Box (2,000–7,999 คะแนน)</option>
          <option value="Platinum" selected>⭐ Platinum Box (8,000+ คะแนน)</option>
        </select>
      </div>
    </div>

    <div class="card-title" style="margin-top:18px;">🔐 ข้อมูล License</div>

    <label>Package A (ระดับราคาพิเศษ)</label>
    <select id="inp-pkg">
      <option value="A1">A1 — ≥ 10,000 ชิ้น/เดือน</option>
      <option value="A2">A2</option><option value="A3">A3</option><option value="A4">A4</option>
      <option value="A5">A5</option>
      <option value="A6">A6 — ≥ 8,000 ชิ้น/เดือน</option>
      <option value="A7">A7 — ≥ 6,000 ชิ้น/เดือน</option>
      <option value="A8">A8 — ≥ 4,000 ชิ้น/เดือน</option>
      <option value="A9">A9</option><option value="A10">A10</option>
      <option value="A11">A11 — ≥ 1,000 ชิ้น/เดือน</option>
      <option value="A12" selected>A12 — ≥ 5 ชิ้น/ใบเสร็จ</option>
    </select>

    <label>วันหมดอายุ License</label>
    <div class="row2">
      <select id="inp-month">
        <option value="01">มกราคม (01)</option><option value="02">กุมภาพันธ์ (02)</option>
        <option value="03">มีนาคม (03)</option><option value="04">เมษายน (04)</option>
        <option value="05">พฤษภาคม (05)</option><option value="06">มิถุนายน (06)</option>
        <option value="07">กรกฎาคม (07)</option><option value="08">สิงหาคม (08)</option>
        <option value="09">กันยายน (09)</option><option value="10">ตุลาคม (10)</option>
        <option value="11">พฤศจิกายน (11)</option><option value="12">ธันวาคม (12)</option>
      </select>
      <select id="inp-year"></select>
    </div>

    <button class="gen-btn" onclick="generate()">🔑 สร้าง License Key</button>
  </div>

  <!-- Key Output -->
  <div class="key-output-wrap" id="key-output-wrap">
    <div class="key-label">License Key ที่สร้าง:</div>
    <div class="key-line">
      <div class="key-text" id="key-out">—</div>
    </div>
    <div class="key-actions">
      <button class="btn-copy" onclick="copyKey()">📋 คัดลอก Key</button>
      <button class="btn-save" onclick="saveKey()">💾 บันทึกลงประวัติ</button>
    </div>
    <div class="key-meta" id="key-meta"></div>
  </div>

  <!-- History -->
  <div class="hist-card">
    <div class="hist-header">
      <div class="hist-title">📑 ประวัติ Key ที่สร้าง</div>
      <button class="btn-csv" onclick="exportCSV()">⬇️ Export CSV</button>
    </div>
    <div class="hist-list" id="hist-list">
      <div class="empty-hist">ยังไม่มีประวัติ — กดบันทึกหลังสร้าง Key</div>
    </div>
  </div>
</div>

<script>
// ⚠️ MUST match _LK_SALT in main.js exactly
const _p1='T',_p2='h',_p3='P',_p4='b',_p5='K',_p6='3',_p7='y';
const _LK_SALT = _p1+_p2+_p3+_p4+_p5+_p6+_p7;

function _hx(s) {
    let h = 5381;
    for (let i = 0; i < s.length; i++) h = Math.imul(h, 33) ^ s.charCodeAt(i);
    return (h >>> 0).toString(36).toUpperCase();
}
function generateKey(thpNum, expiryYYMM, pkgCode) {
    const payload = `${thpNum}|${expiryYYMM}|${pkgCode}`;
    const hash = _hx(payload + _LK_SALT).substring(0, 6);
    return `${thpNum}-${expiryYYMM}-${pkgCode}-${hash}`;
}

// Populate year dropdown
const yearSel = document.getElementById('inp-year');
const now = new Date();
for (let y = now.getFullYear(); y <= now.getFullYear() + 5; y++) {
    const opt = document.createElement('option');
    opt.value = String(y).substring(2);
    opt.textContent = `${y} (พ.ศ. ${y+543})`;
    if (y === now.getFullYear()) opt.selected = true;
    yearSel.appendChild(opt);
}
// Default month = +12
const defMm = ((now.getMonth() + 12) % 12) + 1;
document.getElementById('inp-month').value = String(defMm).padStart(2,'0');
// Default start date = today
document.getElementById('inp-start').value = now.toISOString().split('T')[0];

const MONTH_TH = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const PF_BADGE = { Red:'🔴', Blue:'🔵', Platinum:'⭐' };

let lastRecord = null;

function generate() {
    const thpNum = document.getElementById('inp-thp').value.trim();
    const mm = document.getElementById('inp-month').value;
    const yy = document.getElementById('inp-year').value;
    const pkg = document.getElementById('inp-pkg').value;
    const startDate = document.getElementById('inp-start').value;
    const pfLevel = document.getElementById('inp-pf-level').value;
    const custName = document.getElementById('inp-name').value.trim();
    const custPhone = document.getElementById('inp-phone').value.trim();

    if (!/^\d{8}$/.test(thpNum)) { alert('⚠️ กรุณากรอกเลข Post Family No. 8 หลัก'); return; }

    const expiryYYMM = yy + mm;
    const key = generateKey(thpNum, expiryYYMM, pkg);

    const startLabel = startDate ? formatDateThai(startDate) : '—';
    const expiryYear = 2000 + parseInt(yy);
    const expiryLabel = `${MONTH_TH[parseInt(mm)]} ${expiryYear} (พ.ศ. ${expiryYear+543})`;
    const pfBadge = PF_BADGE[pfLevel] || '';

    document.getElementById('key-out').textContent = key;
    document.getElementById('key-meta').innerHTML = `
      <div><span>Post Family No.:</span> THP-${thpNum}</div>
      <div><span>เริ่มสัญญา:</span> ${startLabel}</div>
      <div><span>หมดอายุ:</span> ${expiryLabel}</div>
      <div><span>Package:</span> <b>${pkg}</b></div>
      <div><span>ระดับ:</span> ${pfBadge} ${pfLevel} Box</div>
    `;
    document.getElementById('key-output-wrap').style.display = 'block';

    lastRecord = { key, thpNum, pkg, mm, yy, startDate, pfLevel, custName, custPhone, ts: new Date().toISOString() };
}

function formatDateThai(dateStr) {
    if (!dateStr) return '—';
    const [y, m, d] = dateStr.split('-');
    return `${parseInt(d)} ${MONTH_TH[parseInt(m)]} ${parseInt(y)+543}`;
}

function copyKey() {
    const key = document.getElementById('key-out').textContent;
    navigator.clipboard.writeText(key).then(() => {
        const btn = document.querySelector('.btn-copy');
        btn.textContent = '✅ คัดลอกแล้ว!';
        setTimeout(() => btn.textContent = '📋 คัดลอก Key', 2000);
    });
}

function safeLocalStorageSave(key, data) {
    // Try saving; if storage is full, trim oldest entries and retry
    const maxRetries = 20;
    let retries = 0;
    while (retries < maxRetries) {
        try {
            localStorage.setItem(key, JSON.stringify(data));
            return true; // success
        } catch (e) {
            if (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014) {
                // Storage full: remove oldest entry and try again
                if (data.length > 1) {
                    data.pop(); // remove last (oldest)
                    retries++;
                } else {
                    // Can't shrink further, clear completely
                    localStorage.removeItem(key);
                    return false;
                }
            } else {
                console.error('localStorage error:', e);
                return false;
            }
        }
    }
    return false;
}

function saveKey() {
    if (!lastRecord) return;
    // Validate required name field
    const nameEl = document.getElementById('inp-name');
    if (!lastRecord.custName) {
        if (nameEl) { nameEl.style.borderColor = '#ef4444'; nameEl.focus(); }
        alert('⚠️ กรุณากรอกชื่อผู้ใช้ / บริษัท ก่อนบันทึก');
        return;
    }
    if (nameEl) nameEl.style.borderColor = '';
    let history = [];
    try { history = JSON.parse(localStorage.getItem('tpb_keys') || '[]'); } catch(e) { history = []; }

    // Avoid duplicates
    if (history.find(r => r.key === lastRecord.key)) {
        const btn = document.querySelector('.btn-save');
        btn.textContent = 'ℹ️ มีแล้ว';
        setTimeout(() => btn.textContent = '💾 บันทึกลงประวัติ', 2000);
        return;
    }

    history.unshift(lastRecord);
    if (history.length > 100) history.splice(100); // keep max 100

    const ok = safeLocalStorageSave('tpb_keys', history);
    renderHistory();

    const btn = document.querySelector('.btn-save');
    if (ok) {
        btn.textContent = '✅ บันทึกแล้ว!';
        btn.style.color = '#4ade80';
    } else {
        btn.textContent = '⚠️ พื้นที่เต็ม — บันทึกไม่ได้';
        btn.style.color = '#f97316';
    }
    setTimeout(() => { btn.textContent = '💾 บันทึกลงประวัติ'; btn.style.color = ''; }, 3000);
}


function renderHistory() {
    const history = JSON.parse(localStorage.getItem('tpb_keys') || '[]');
    const el = document.getElementById('hist-list');
    if (history.length === 0) {
        el.innerHTML = '<div class="empty-hist">ยังไม่มีประวัติ — กดบันทึกหลังสร้าง Key</div>';
        return;
    }
    el.innerHTML = history.map((r, i) => {
        const pfBadge = PF_BADGE[r.pfLevel] || '';
        const expLabel = `${MONTH_TH[parseInt(r.mm)]} ${2000+parseInt(r.yy)}`;
        const nameStr = r.custName ? `<b style="color:#e2e8f0;">${r.custName}</b>` : '<span style="color:#475569;">ไม่ระบุ</span>';
        const phoneStr = r.custPhone ? ` &nbsp;📞 ${r.custPhone}` : '';
        return `
          <div class="hist-item">
            <div style="flex:1; min-width:0;">
              <div style="margin-bottom:3px;">${nameStr}${phoneStr}</div>
              <div class="hist-key">${r.key}</div>
              <div class="hist-info">
                <strong>THP-${r.thpNum}</strong> &nbsp;|&nbsp; ${pfBadge} ${r.pfLevel || ''} &nbsp;|&nbsp;
                Pkg: <strong>${r.pkg}</strong> &nbsp;|&nbsp; หมด: ${expLabel}
              </div>
            </div>
            <button class="hist-copy" onclick="quickCopy('${r.key}', this)">📋 Copy</button>
          </div>
        `;
    }).join('');
}

function quickCopy(key, btn) {
    navigator.clipboard.writeText(key).then(() => {
        btn.textContent = '✅';
        setTimeout(() => btn.textContent = '📋 Copy', 1500);
    });
}

function exportCSV() {
    const history = JSON.parse(localStorage.getItem('tpb_keys') || '[]');
    if (history.length === 0) { alert('ยังไม่มีข้อมูล'); return; }
    let csv = 'ชื่อผู้ใช้,เบอร์โทร,Key,THP No.,Package,Post Family Level,เริ่มสัญญา,หมดอายุ\n';
    history.forEach(r => {
        const expLabel = `${MONTH_TH[parseInt(r.mm)]} ${2000+parseInt(r.yy)}`;
        const startLabel = r.startDate ? formatDateThai(r.startDate) : '—';
        csv += `"${r.custName||''}","${r.custPhone||''}","${r.key}","THP-${r.thpNum}","${r.pkg}","${r.pfLevel||''}","${startLabel}","${expLabel}"\n`;
    });
    const blob = new Blob(['\ufeff'+csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `tpb_license_keys_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
}

// Init
renderHistory();
</script>
</body>
</html>
